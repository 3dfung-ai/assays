<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self' blob:; object-src 'self' blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Assays</title>
<meta name="description" content="Your Abbott Alinity IFUs: find one fast, see its key numbers, search inside all of them. Reads from your own Google Drive.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#131A24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#131A24; --panel:#18212D; --raise:#212C3A; --sunk:#0F151D;
  --line:#2C3848; --line-2:#222C3A;
  --ink:#F1F5F9; --ink-2:#C5CFDA; --muted:#93A0AF; --faint:#66737F;
  --c:#6FC9B4; --c-soft:rgba(111,201,180,.13);
  --i:#B3A4F2; --i-soft:rgba(179,164,242,.14);
  --ok:#7FD1A2; --warn:#EBBE55; --bad:#F2806F; --warn-soft:rgba(235,190,85,.12);
  --link:#79B8F0; --mark:rgba(235,190,85,.28);
  --act:#E9EFF6; --act-ink:#131A24;
  --sh:0 18px 50px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.35);
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-d:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --top:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--ink-2);outline-offset:2px;border-radius:8px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
kbd{font:600 11px/1 var(--font);padding:3px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;color:var(--muted);background:var(--panel)}
.num{font-variant-numeric:tabular-nums}
a{color:var(--link)}
.mut{color:var(--muted)}
.fine{margin:6px 0 0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.hint{color:var(--muted);font-size:13px}

/* ---------- top bar ---------- */
.top{height:var(--top);display:flex;align-items:center;gap:16px;padding:0 max(18px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left));background:var(--bg);border-bottom:1px solid var(--line-2)}
.brand{display:flex;align-items:center;gap:10px;width:286px;flex:none;font:650 19px/1 var(--font-d);letter-spacing:-.005em;white-space:nowrap}
.mark{position:relative;width:14px;height:22px;border:2px solid var(--ink-2);border-top:0;border-radius:0 0 4px 4px}
.mark::after{content:"";position:absolute;left:1px;right:1px;bottom:1px;height:9px;border-radius:0 0 2px 2px;background:linear-gradient(90deg,var(--c) 50%,var(--i) 50%)}
.search{position:relative;flex:1;max-width:760px;display:flex;align-items:center}
.search .si-ic{position:absolute;left:14px;color:var(--muted);pointer-events:none;display:flex}
.search input{width:100%;height:44px;padding:0 84px 0 44px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:16px/1 var(--font);outline:none}
.search input:focus{border-color:#4A5B70;background:var(--raise)}
.search input::placeholder{color:var(--faint)}
.search input::-webkit-search-cancel-button{display:none}
.search .qx{position:absolute;right:46px;height:28px;padding:0 8px;border:0;border-radius:6px;background:none;color:var(--muted);font-size:13px}
.search .qx:hover{color:var(--ink);background:var(--line-2)}
.search kbd{position:absolute;right:12px;pointer-events:none}
.search input:focus ~ kbd{opacity:0}
.right{display:flex;align-items:center;gap:6px;margin-left:auto}
.ib{display:inline-grid;place-items:center;width:38px;height:38px;border:0;border-radius:50%;background:none;color:var(--ink-2);flex:none}
.ib:hover:not(:disabled){background:var(--raise);color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:8px;height:34px;max-width:220px;padding:0 12px;border:1px solid var(--line);border-radius:17px;background:none;color:var(--ink-2);font-size:13px;font-weight:550}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.pill.local .dot{background:var(--faint)}
.pill.busy .dot{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
.pill.off .dot{background:var(--warn)}
.pill.err{border-color:var(--bad);color:var(--bad)} .pill.err .dot{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none}
.btn:hover:not(:disabled){background:var(--raise)}
.btn.primary{background:var(--act);border-color:var(--act);color:var(--act-ink)}
.btn.primary:hover:not(:disabled){background:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{height:30px;padding:0 11px;font-size:13px;border-radius:8px}
.btn svg.i{width:16px;height:16px}
.btn kbd{margin-left:2px;background:transparent;border-color:rgba(19,26,36,.25);color:inherit;opacity:.65}
.field{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink);font:inherit;outline:none}
.field:focus{border-color:#4A5B70}

/* ---------- layout ---------- */
.main{display:grid;grid-template-columns:320px minmax(0,1fr);height:calc(100dvh - var(--top))}
.list{grid-column:1;grid-row:1;overflow:auto;padding:12px 10px 40px;border-right:1px solid var(--line-2);scrollbar-width:thin}
.detail{grid-column:2;grid-row:1;overflow:auto;scrollbar-width:thin}
.pdf{grid-column:2;grid-row:1;z-index:6;display:flex;flex-direction:column;min-height:0;background:var(--sunk);border-left:1px solid var(--line-2)}

/* ---------- list ---------- */
.filters{display:flex;gap:6px;padding:2px 6px 10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:14px;background:none;color:var(--ink-2);font-size:13px;font-weight:550}
.chip .n{color:var(--faint);font-size:12px}
.chip.on{background:var(--raise);border-color:#3A495C;color:var(--ink)}
.grp{margin-top:6px}
.gh{display:flex;justify-content:space-between;align-items:baseline;padding:10px 10px 4px;color:var(--muted);font-size:12.5px;font-weight:600}
.gh .n{color:var(--faint);font-weight:500}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:6px 10px;border:0;border-radius:8px;background:none;color:var(--ink-2);text-align:left;text-decoration:none;font-size:14.5px}
.row:hover{background:var(--panel);color:var(--ink)}
.row.on{background:var(--raise);color:var(--ink);box-shadow:inset 2px 0 0 var(--ink-2)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{flex:none;color:var(--muted);font-size:12.5px}
.row .star{color:var(--warn);display:flex} .row .star svg{width:14px;height:14px;fill:currentColor}
.row.extra .nm{color:var(--muted)}
.row.link{color:var(--link)} .row.link b{font-weight:600}
.pc{display:inline-grid;place-items:center;width:20px;height:20px;flex:none;border-radius:6px;font:700 12px/1 var(--font);text-transform:lowercase}
.pc-c{background:var(--c-soft);color:var(--c)}
.pc-i{background:var(--i-soft);color:var(--i)}
.pc-x{color:var(--muted)} .pc-x svg{width:15px;height:15px}
.sig{margin-left:6px;color:var(--muted);font-size:12px}
.none{padding:12px 10px;color:var(--muted)}
.list .none{font-size:14px}

/* ---------- detail ---------- */
.dh{position:sticky;top:0;z-index:3;display:flex;align-items:flex-start;gap:16px;padding:22px 32px 16px;background:linear-gradient(var(--bg) 82%,rgba(19,26,36,0))}
.titles{flex:1;min-width:0}
.dh h1{margin:0;font:650 30px/1.15 var(--font-d);letter-spacing:-.012em}
.dh .tag{margin-left:10px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;color:var(--muted);font:600 12px/1.4 var(--font);vertical-align:middle}
.dh .meta{margin:6px 0 0;color:var(--muted);font-size:13.5px;white-space:pre-wrap}
.acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding-top:2px}
.pinb.on{color:var(--warn)} .pinb.on svg{fill:currentColor}
.dbody{padding:4px 32px 64px;max-width:1180px}
.dbody h2{margin:0;font:650 15px/1.3 var(--font-d);color:var(--ink-2)}
.blank{padding:80px 40px;max-width:560px;color:var(--ink-2)}
.blank p{margin:0 0 12px}
.pg{display:inline-flex;align-items:center;height:22px;padding:0 7px;border:1px solid var(--line);border-radius:6px;background:none;color:var(--link);font-size:12px;font-weight:600;white-space:nowrap}
button.pg:hover{background:var(--raise)}
.pg.warn{border-color:rgba(235,190,85,.45);color:var(--warn);background:var(--warn-soft)}

/* key numbers */
.kn{margin-top:8px}
.kn-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.kn-head .fine{margin:0}
.toggle{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer}
.toggle input{accent-color:var(--ink-2)}
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,.8fr);gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:14px;overflow:hidden}
.cell{padding:16px 18px 18px;background:var(--panel);text-align:left;border:0;color:inherit;font-size:14.5px}
.cell .lab,.card .lab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;color:var(--muted);font-size:13px;font-weight:600}
.cell.big > div:nth-child(2){font:600 26px/1.25 var(--font-d);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.cell.big .si{font-size:16px}
.cell.ref{cursor:pointer;background:var(--panel)}
.cell.ref:hover:not(:disabled){background:var(--raise)}
.cell.ref .go{color:var(--link);font-size:13.5px}
.si{display:inline-block;margin-left:6px;padding:0 6px;border:1px solid rgba(121,184,240,.3);border-radius:999px;color:var(--link);font:500 12.5px/1.6 var(--font);white-space:nowrap;vertical-align:middle}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:14px}
.card{padding:14px 16px 16px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);font-size:14px;min-width:0}
.card .ln{padding:2px 0}
.card .prose{margin:0;color:var(--ink-2)}
.card p{margin:0}
.sec + .sec{margin-top:8px}
.sec .sl{color:var(--muted);font-size:12.5px;margin-bottom:2px}
.sec.no .ln{color:var(--ink-2)}
.sec.no .sl{color:var(--bad)}
details.more{margin-top:8px;color:var(--muted);font-size:13px}
details.more summary{cursor:pointer}
table.prec{width:100%;border-collapse:collapse;font-size:13.5px}
table.prec th{padding:2px 8px 4px 0;color:var(--muted);font-weight:600;text-align:left;font-size:12.5px}
table.prec td{padding:4px 8px 4px 0;border-top:1px solid var(--line-2);vertical-align:top}
table.prec .r{text-align:right;padding-right:0}

/* matches */
.matches{margin:4px 0 22px;padding:14px 16px;border:1px solid rgba(235,190,85,.25);border-radius:12px;background:rgba(235,190,85,.04)}
.matches h2{display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
.matches h2 .n{margin-left:auto;color:var(--muted);font:500 13px var(--font)}
.hit{display:flex;gap:12px;align-items:flex-start;width:100%;padding:8px 6px;border:0;border-top:1px solid var(--line-2);background:none;color:var(--ink-2);text-align:left;font-size:13.5px;line-height:1.5;border-radius:0}
.hit:hover{background:var(--panel)}
.hit .pg{margin-top:1px}
mark{background:var(--mark);color:var(--ink);border-radius:3px;padding:0 1px}

/* note */
.mynote{margin-top:26px;max-width:760px}
.mynote h2{margin-bottom:8px}
.note{resize:vertical;min-height:48px;line-height:1.5}
.note-box{margin-top:8px;padding:16px 18px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);max-width:640px}
.note-box p{margin:0 0 6px}

/* PDF pane */
.phead{display:flex;align-items:center;gap:10px;height:52px;padding:0 10px 0 18px;border-bottom:1px solid var(--line-2);background:var(--bg)}
.pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pframe{flex:1;width:100%;border:0;background:#525659}
.pstatus{margin:auto;text-align:center;color:var(--ink-2);padding:30px}
.bar{width:220px;height:3px;margin:0 auto 14px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;width:40%;height:100%;background:var(--ink-2);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}

/* welcome */
.welcome{grid-column:1/-1;max-width:600px;margin:9vh auto 0;padding:0 24px}
.welcome h2{margin:0 0 10px;font:650 26px/1.2 var(--font-d)}
.welcome p{color:var(--ink-2)}
.welcome .bar{margin:22px 0}
.steps{padding-left:22px;color:var(--ink-2)} .steps li{margin:6px 0}
details.paste{margin-top:18px;color:var(--muted)} details.paste summary{cursor:pointer}
details.paste .row{display:flex;gap:8px;margin-top:10px;padding:0}
details.paste .row:hover{background:none}

/* ---------- dialogs, toasts ---------- */
.scrim{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(6,9,14,.62)}
.modal{width:min(520px,100%);max-height:calc(100dvh - 40px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--sh)}
.modal.wide{width:min(660px,100%)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 14px 6px 22px}
.mhead h2{margin:0;font:650 18px/1.3 var(--font-d)}
.mbody{padding:6px 22px 18px;overflow:auto}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line-2)}
.mtext{margin:0 0 10px;color:var(--ink-2)}
.settings section{padding:12px 0 14px;border-bottom:1px solid var(--line-2)}
.settings section:last-of-type{border-bottom:0}
.settings h3{margin:0 0 6px;font:650 14px/1.3 var(--font-d)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.warnline{margin:0 0 10px;padding:8px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.fl{display:grid;gap:6px;margin:8px 0 10px;color:var(--muted);font-size:13px}
.keys-t{width:100%;border-collapse:collapse;margin:4px 0 14px;font-size:14px}
.keys-t td{padding:6px 10px 6px 0;border-top:1px solid var(--line-2);color:var(--ink-2);vertical-align:top}
.keys-t td:first-child{white-space:nowrap;width:1%}
.keys kbd + kbd{margin-left:4px}
.toasts{position:fixed;left:50%;bottom:22px;z-index:60;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:14px;padding:11px 14px 11px 16px;border:1px solid var(--line);border-radius:12px;background:var(--raise);box-shadow:var(--sh);font-size:14px}
.toast button{border:0;background:none;color:var(--link);font-weight:600;padding:2px 4px}
.elsewhere{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;background:var(--bg)}

/* ---------- narrow screens ---------- */
@media (max-width:1180px){ .hero{grid-template-columns:1fr 1fr} .hero .ref{grid-column:1/-1} }
@media (max-width:820px){
  :root{--top:60px}
  .brand{width:auto} .brand .word{display:none}
  .pill span{display:none} .pill{padding:0 11px}
  .main{grid-template-columns:1fr}
  .list,.detail,.pdf{grid-column:1}
  .detail{display:none}
  body.show-detail .list{display:none}
  body.show-detail .detail{display:block}
  .dh{padding:14px 16px 12px;flex-wrap:wrap}
  .dh h1{font-size:24px}
  .acts{width:100%;justify-content:flex-start}
  .dbody{padding:4px 16px 48px}
  .hero{grid-template-columns:1fr}
  .search kbd{display:none}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span><span class="word">Assays</span></div>
  <div class="search" role="search">
    <span class="si-ic" id="qicon"></span>
    <input id="q" type="search" autocomplete="off" spellcheck="false" aria-label="Search assays and IFU text" placeholder="Search your IFUs" disabled>
    <button class="qx" id="qclear" type="button" hidden>Clear</button>
    <kbd>/</kbd>
  </div>
  <div class="right">
    <button class="pill" id="sync-pill" type="button"></button>
    <button class="ib" id="settings-btn" aria-label="Settings"></button>
    <button class="ib" id="help-btn" aria-label="Help (?)"></button>
  </div>
</header>
<main class="main" id="main"></main>
<div id="modal-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="elsewhere" id="elsewhere" hidden></div>
<script>
const BUILD = "1.0 · f339d9";
/* ============ Assays logic: pure functions, no page access (tested in Node) ============ */
(function (root) {
  const AL = {};

  /* ---------- text normalisation ---------- */
  // Lower case, no accents, Greek letters spelled out, punctuation to spaces.
  function fold(s) {
    return String(s == null ? '' : s)
      .replace(/[βß]/g, 'b').replace(/[αɑ]/g, 'a').replace(/γ/g, 'g').replace(/[µμ]/g, 'u')
      .normalize('NFKD').replace(/[̀-ͯ]/g, '')
      .toLowerCase();
  }
  const words = s => fold(s).replace(/[∙·•]/g, '').split(/[^a-z0-9]+/).filter(Boolean);
  const squash = s => words(s).join('');
  AL.fold = fold; AL.words = words; AL.squash = squash;

  const MONTHS = { january: 1, february: 2, march: 3, april: 4, may: 5, june: 6, july: 7, august: 8, september: 9, october: 10, november: 11, december: 12 };
  function revKey(rev) {   // "Revised February 2018" -> 201802
    const m = /([A-Za-z]+)\s+(\d{4})/.exec(rev || '');
    return m ? Number(m[2]) * 100 + (MONTHS[m[1].toLowerCase()] || 0) : 0;
  }
  AL.revKey = revKey;

  // Short display name: "Alanine Aminotransferase2" stays (Abbott's own name), "A1AT — Alinity" -> "A1AT".
  function displayName(d) { return String(d.title || '').replace(/\s+—\s+Alinity.*$/, '').trim(); }
  AL.displayName = displayName;
  function platformCode(d) {
    const p = String(d.platform || '');
    return /alinity c/i.test(p) ? 'c' : /alinity i/i.test(p) ? 'i' : '';
  }
  AL.platformCode = platformCode;

  /* ---------- index ---------- */
  // Prepares a library for searching: name keys for every doc, folded page text.
  function buildIndex(lib) {
    const docs = (lib && Array.isArray(lib.docs) ? lib.docs : []).map(d => {
      const names = [displayName(d), d.title, ...(d.aliases || [])].filter(Boolean);
      const keys = [...new Set(names.map(squash).filter(Boolean))];
      const toks = [...new Set(names.flatMap(words))];
      return Object.assign({}, d, {
        name: displayName(d), pc: platformCode(d), rk: revKey(d.revision),
        _keys: keys, _toks: toks, _title: squash(displayName(d)),
        _pages: (d.pages || []).map(p => fold(p)),
      });
    });
    const byId = new Map(docs.map(d => [d.id, d]));
    return { docs, byId, version: lib && lib.version, built: lib && lib.built };
  }
  AL.buildIndex = buildIndex;

  /* ---------- name search: what you type to open an IFU ---------- */
  // Returns docs ranked by how well the query names them (score > 0 only).
  function searchNames(ix, q, opts = {}) {
    const qs = squash(q), qt = words(q);
    if (!qs) return [];
    const out = [];
    for (const d of ix.docs) {
      let s = 0;
      for (const k of d._keys) {
        let v = 0;
        if (k === qs) v = 100;
        else if (k.startsWith(qs)) v = 80 - Math.min(20, k.length - qs.length);

/* ---------- storage: IndexedDB key-value store ---------- */
const DB_NAME = 'assays-app', DB_STORE = 'kv';
const Store = {
  db: null, mode: 'idb',
  async open() {
    try {
      if (!('indexedDB' in window)) throw new Error('no idb');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open(DB_NAME, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
      });
    } catch (e) { this.mode = 'mem'; this.mem = new Map(); }
  },
  _tx(mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(DB_STORE, mode), st = t.objectStore(DB_STORE);
      let out; const r = fn(st);
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out);
      t.onerror = t.onabort = () => rej(t.error || new Error('transaction failed'));
    });
  },
  async get(k) { if (this.mode === 'mem') return this.mem.get(k); return this._tx('readonly', st => st.get(k)); },
  async put(obj) {
    if (this.mode === 'mem') { for (const [k, v] of Object.entries(obj)) this.mem.set(k, v); return; }
    return this._tx('readwrite', st => { let last; for (const [k, v] of Object.entries(obj)) last = st.put(v, k); return last; });
  },
  async del(k) { if (this.mode === 'mem') { this.mem.delete(k); return; } return this._tx('readwrite', st => st.delete(k)); },
  async keys() { if (this.mode === 'mem') return [...this.mem.keys()]; return this._tx('readonly', st => st.getAllKeys()); },

const Sync = { busy: false, again: false, timer: 0, err: null, detail: '', fails: 0 };

    not_an_ifu: 'That file isn’t in the IFU folder', not_found: 'That PDF is no longer in Drive', too_big: 'That PDF is too large to fetch',

async function syncNow(manual) {
  const S = App.sync;
  if (!syncReady()) { updatePill(); return; }
  if (Sync.busy) { Sync.again = true; return; }
  if (navigator.onLine === false) { Sync.err = 'offline'; updatePill(); return; }
  Sync.busy = true; updatePill();
  const sent = new Map(), changes = [];
  let changed = 0;
  try {
    for (const id of Object.keys(S.dirty)) {
      const r = App.user.get(id);
      if (!r) { delete S.dirty[id]; continue; }
      sent.set(id, JSON.stringify(r));
      changes.push({ id, baseRev: S.base[id] === undefined ? null : S.base[id], data: r });
    }
    const out = await call({ op: 'sync', v: 1, device: S.device, changes, have: Object.assign({}, S.base) });
    for (const a of out.accepted || []) {
      if (!sent.has(a.id)) continue;
      S.base[a.id] = a.rev; S.baseData[a.id] = JSON.parse(sent.get(a.id));
      const r = App.user.get(a.id);
      if (r && JSON.stringify(r) === sent.get(a.id)) delete S.dirty[a.id];
    }
    for (const c of [...(out.conflicts || []), ...(out.updates || [])]) changed += reconcile(c);
    S.server = { count: out.count, savedAt: out.savedAt, savedBy: out.savedBy, lastBackupAt: out.lastBackupAt };
    Sync.err = null; Sync.detail = ''; Sync.fails = 0; S.lastSync = Date.now();
  } catch (e) {
    Sync.err = (e && e.code) || 'network'; Sync.detail = (e && e.detail) || ''; Sync.fails++;
  } finally {
    Sync.busy = false;
    await saveNow();
    if (changed) render(); else updatePill();
    if (manual) toast(Sync.err ? 'Couldn’t sync: ' + errText(Sync.err, Sync.detail) + '.' : 'Pins and notes are up to date.');
    if (Sync.again) { Sync.again = false; syncSoon(400); }
    else if (Sync.err === 'bad_key' || Sync.err === 'corrupt_store') { }
    else if (pendingCount() && Sync.err) syncSoon(Math.min(300000, 15000 * Math.pow(2, Math.min(Sync.fails, 4))));
    else if (pendingCount()) syncSoon(1200);
  }
}
// Brings one record from Drive into this browser, merging with an unsent local change. Returns 1 if anything changed.
function reconcile(u) {
  const S = App.sync, id = u.id, local = App.user.get(id), dirty = !!S.dirty[id];
  if (u.purged) {
    if (dirty && local) { S.base[id] = u.rev; S.baseData[id] = null; return 0; }
    const had = App.user.delete(id);
    delete S.base[id]; delete S.baseData[id]; delete S.dirty[id];
    return had ? 1 : 0;
  }
  if (!dirty || !local) { App.user.set(id, u.data); S.base[id] = u.rev; S.baseData[id] = u.data; return 1; }
  const merged = AL.mergeUser(S.baseData[id], local, u.data);
  S.base[id] = u.rev; S.baseData[id] = u.data;
  App.user.set(id, merged);
  if (AL.deepEq(merged, u.data)) delete S.dirty[id];
  return 1;
}

/* ----- PDFs: fetched once from Drive, then kept in this browser ----- */
const blobUrls = new Map();
async function pdfBlobUrl(f, onStage) {
  if (blobUrls.has(f.id)) return blobUrls.get(f.id);
  let rec = await Store.get('pdf:' + f.id);
  if (rec && rec.modified !== f.modified) rec = null;
  if (!rec) {
    if (!syncReady()) throw Object.assign(new Error('nosync'), { code: 'nosync' });
    if (navigator.onLine === false) throw Object.assign(new Error('offline'), { code: 'offline' });
    if (onStage) onStage(`Fetching from Drive (${AL.mb(f.size || 0)})…`);
    const out = await call({ op: 'pdf', fileId: f.id }, { ms: 120000 });
    const bin = atob(out.b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    rec = { id: f.id, name: out.name, modified: out.modified, size: bytes.length, data: bytes.buffer };
    try {
      await Store.put({ ['pdf:' + f.id]: rec });
      App.pdfs[f.id] = { modified: rec.modified, size: rec.size, at: Date.now(), name: rec.name };
      saveSoon();
    } catch (e) { /* keep going without a saved copy */ }
  }
  const url = URL.createObjectURL(new Blob([rec.data], { type: 'application/pdf' }));
  blobUrls.set(f.id, url);
  return url;
}

  for (const u of blobUrls.values()) URL.revokeObjectURL(u);
  blobUrls.clear(); App.pdfs = {};
  await saveNow();
  toast('Saved IFUs removed from this browser. They’ll be fetched from Drive when you open them.');
}
function exportUser() {
  const recs = [...App.user.values()].filter(r => r.pin || r.note).map(r => Object.assign({ assay: (docById(r.doc) || {}).name || r.doc }, r));
  const blob = new Blob([JSON.stringify({ kind: 'assays-pins-notes', exported: new Date().toISOString(), records: recs }, null, 2)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: `assays-pins-notes-${new Date().toISOString().slice(0, 10)}.json` });
  document.body.append(a); a.click(); a.remove();
}
function openHelp() {
  const k = (...keys) => h('span', { class: 'keys' }, keys.map(x => h('kbd', { text: x })));
  modal({ title: 'Using Assays', body: h('div', { class: 'help' },
    h('p', { class: 'mtext', text: 'Type to find an assay by name or by the abbreviation you use (ALT, hCG, FT4, paracetamol). Words that aren’t an assay name are searched inside all the IFUs, for example biotin, heterophile or "high dose hook".' }),
    h('table', { class: 'keys-t' }, h('tbody', {},
      [[k('/'), 'Search from anywhere'], [k('↑', '↓'), 'Move through the list'], [k('Enter'), 'Open the IFU (at the first matching page when you searched inside the IFUs)'],
        [k('Esc'), 'Close the IFU, then clear the search'], [k('P'), 'Pin or unpin the assay'], [k('M'), 'Mayo Clinic Labs for this assay'], [k('S'), 'SGH test directory for this assay'],
        [k('Ctrl', 'click'), 'Open the IFU in a new tab']].map(([a, b]) => h('tr', {}, h('td', {}, a), h('td', { text: b }))))),
    h('p', { class: 'mtext', text: 'Key numbers are read from the IFU automatically. An amber “Check” link means the reading was uncertain; the page link always opens the source.' }),
    h('p', { class: 'mtext', text: 'Page links open the IFU beside the list. The first time, a PDF comes from your Drive; after that it opens from this browser, even offline.' })) });
}

/* ============ setup link ============ */
function setupLink() {
  const payload = btoa(unescape(encodeURIComponent(JSON.stringify({ u: App.sync.url, k: App.sync.key })))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return location.origin + location.pathname + '#sync=' + payload;
}
function readSetupHash() {
  const m = /^#sync=([A-Za-z0-9_-]+)$/.exec(location.hash || '');
  if (!m) return null;
  let o = null;
  try { const b = m[1].replace(/-/g, '+').replace(/_/g, '/'); o = JSON.parse(decodeURIComponent(escape(atob(b + '==='.slice((b.length + 3) % 4))))); } catch (e) { }
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
  return o && o.u && o.k ? { url: o.u, key: o.k } : null;
}
function deviceGuess() {
  const ua = navigator.userAgent || '';
  const os = /Windows/.test(ua) ? 'Windows PC' : /Mac/.test(ua) ? 'Mac' : /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iPhone or iPad' : 'Computer';
  return os + ' ' + Math.random().toString(36).slice(2, 6);
}
function offerSetupLink(link) {
  if (!validScriptUrl(link.url)) { toast('That setup link isn’t a Google Apps Script link, so it was ignored.'); return; }
  if (link.url === App.sync.url && link.key === App.sync.key) { refreshLibrary(true); return; }
  const dev = h('input', { class: 'field', value: App.sync.device || deviceGuess(), 'aria-label': 'Name for this PC', autofocus: true });
  modal({
    title: 'Connect this browser to your IFU library?',
    body: [h('p', { class: 'mtext', text: 'Assays will load your IFU library and PDFs from your Google Drive through your own Assays script, and keep your pins and notes in step with your other PC.' }),
      h('label', { class: 'fl' }, h('span', { text: 'Name for this PC (shown in sync details)' }), dev),
      h('p', { class: 'hint', text: 'Only continue if this link came from your own email or script.' })],
    actions: [{ label: 'Not now' }, { label: 'Connect', primary: true, act: () => { connect(link.url, link.key, dev.value.trim() || deviceGuess()); return true; } }],
  });
}
async function connect(url, key, device) {
  const S = App.sync, changedServer = url !== S.url;
  S.url = url; S.key = key; S.device = device;
  if (changedServer) { S.base = {}; S.baseData = {}; S.purge = {}; for (const id of App.user.keys()) S.dirty[id] = 1; }
  Sync.err = null;
  await saveNow();
  await refreshLibrary(false);
  if (!App.libErr) toast(`Connected. ${App.lib ? plural(App.lib.count, 'IFU') + ' ready.' : ''}`);
  syncNow(false);
  refreshSgh(false);
}
function turnOff() {
  const S = App.sync;
  S.url = ''; S.key = ''; S.base = {}; S.baseData = {}; S.purge = {}; S.server = null;
  for (const id of App.user.keys()) S.dirty[id] = 1;
  saveNow(); render();
  toast('Disconnected. The library stays in this browser.');
}

/* ============ boot ============ */
const narrow = () => typeof matchMedia === 'function' && matchMedia('(max-width: 820px)').matches;
let releaseLock = null, bc = null;
function holdLock(wait) {
  return new Promise(res => {
    if (!navigator.locks || !navigator.locks.request) return res(true);
    const cb = lock => { if (!lock) { res(false); return; } res(true); return new Promise(r => { releaseLock = r; }); };
    if (wait) { navigator.locks.request('assays-main', cb); return; }
    navigator.locks.request('assays-main', { ifAvailable: true }, cb).catch(() => res(false));
  });
}
function showElsewhere(text, btn, fn) {
  const el = $('#elsewhere');
  el.replaceChildren(h('div', { class: 'modal', style: { padding: '28px', textAlign: 'center', width: 'min(440px,100%)' } }, h('p', { class: 'mtext', text }), h('button', { class: 'btn primary', text: btn, onclick: fn })));
  el.hidden = false;
}
async function boot() {
  loadUI();
  try { bc = new BroadcastChannel('assays-app'); } catch (e) { bc = null; }
  if (bc) bc.onmessage = async e => {
    if (!e.data || e.data.from === App.tab) return;
    if (e.data.t === 'takeover' && App.owner) {
      await flush();
      App.owner = false; App.booted = false; clearTimeout(Sync.timer);
      if (releaseLock) releaseLock();
      showElsewhere('Assays is now open in another tab.', 'Use it here instead', () => location.reload());
    }
  };
  if (!await holdLock(false)) {
    showElsewhere('Assays is already open in another tab.', 'Use it here instead', async () => {
      if (bc) bc.postMessage({ t: 'takeover', from: App.tab });
      $('#elsewhere').hidden = true;
      await holdLock(true);
      start();
    });
    return;
  }
  start();
}
async function start() {
  App.owner = true;
  await Store.open();
  try {
    const [state, lib, files, sgh] = await Promise.all([Store.get('state'), Store.get('lib'), Store.get('files'), Store.get('sgh')]);
    if (state) {
      App.user = new Map((state.user || []).map(r => [r.id, r]));
      Object.assign(App.sync, state.sync || {});
      App.pdfs = state.pdfs || {};
    }
    if (lib && lib.docs) setLibrary(lib);
    if (files) { App.files = files.list || []; App.filesAt = files.at || 0; App.folderUrl = files.folderUrl || ''; App.folderFound = files.folderFound !== false; FILES = fileByName(); }
    if (sgh) App.sgh = sgh;
  } catch (e) { toast('This browser couldn’t read the saved library. It will be fetched again.'); }
  bindUI();
  App.booted = true;
  const link = /^#sync=/.test(location.hash) ? readSetupHash() : null;
  render();
  if (App.ix && !App.ui.sel && App.ix.docs.length) { /* leave the welcome hint until something is picked */ }
  window.addEventListener('online', () => { Sync.err = null; updatePill(); syncNow(false); });
  window.addEventListener('offline', () => { Sync.err = 'offline'; updatePill(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { syncNow(false); if (Date.now() - App.filesAt > 3600000) refreshLibrary(false); } else flush(); });
  window.addEventListener('pagehide', () => { flush(); });
  setInterval(() => { if (document.visibilityState === 'visible') syncNow(false); }, 180000);
  setInterval(updatePill, 30000);
  if (syncReady()) { refreshLibrary(false); setTimeout(() => syncNow(false), 600); setTimeout(() => refreshSgh(false), 2500); }
  if (link) offerSetupLink(link);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
  if (!TOUCH) setTimeout(() => { const q = $('#q'); if (q && !q.disabled && !document.querySelector('#modal-root .scrim')) q.focus(); }, 50);
}
function bindUI() {
  $('#settings-btn').innerHTML = ICON.gear; $('#help-btn').innerHTML = ICON.help;
  $('#qicon').innerHTML = ICON.search;
  $('#settings-btn').onclick = openSettings;
  $('#help-btn').onclick = openHelp;
  $('#sync-pill').onclick = openSettings;
  const q = $('#q');
  q.addEventListener('input', () => { setQuery(q.value); $('#qclear').hidden = !q.value; });
  $('#qclear').onclick = () => { q.value = ''; $('#qclear').hidden = true; setQuery('', true); q.focus(); };
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (qTimer) { clearTimeout(qTimer); qTimer = 0; runQuery(); } moveSel(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (qTimer) { clearTimeout(qTimer); qTimer = 0; runQuery(); }
      const d = anyDoc(App.ui.sel); if (!d) return;
      const tg = textGroupFor(d.id), viaText = tg && !App.names.some(x => x.id === d.id);
      openPdf(d, viaText ? tg.hits[0].page : 1, e);
    } else if (e.key === 'Escape') {
      if (closePdf(true)) { e.preventDefault(); return; }
      if (q.value) { e.preventDefault(); q.value = ''; $('#qclear').hidden = true; setQuery('', true); }
      else q.blur();
    }
  });
  window.addEventListener('hashchange', () => { if (/^#sync=/.test(location.hash)) { const l = readSetupHash(); if (l) offerSetupLink(l); } });
  document.addEventListener('keydown', onKey);
  window.addEventListener('resize', () => { if (!narrow()) document.body.classList.remove('show-detail'); });
}
function onKey(e) {
  if (!App.booted || e.defaultPrevented) return;
  if (document.querySelector('#modal-root .scrim') || !$('#elsewhere').hidden) return;
  const t = e.target, typing = t && t.closest && t.closest('input,textarea,select,[contenteditable]');
  if ((e.key === 'k' && (e.ctrlKey || e.metaKey)) || (e.key === '/' && !typing)) { e.preventDefault(); const q = $('#q'); q.focus(); q.select(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  const d = anyDoc(App.ui.sel);
  if (e.key === 'Escape') { if (!closePdf()) { if (App.q) { $('#q').value = ''; setQuery('', true); } } }
  else if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
  else if (e.key === 'Enter' && d && !(t && t.closest && t.closest('button,a'))) { e.preventDefault(); openPdf(d, 1, e); }
  else if ((e.key === 'p' || e.key === 'P') && d) togglePin(d);
  else if ((e.key === 'm' || e.key === 'M') && d && !d.extra) window.open(AL.mayoUrl(d.mayo || d.name), '_blank', 'noopener');
  else if ((e.key === 's' || e.key === 'S') && d && !d.extra) { const t = sghTarget(d); if (t.copy) copyQuiet(t.copy); window.open(t.url, '_blank', 'noopener'); }
  else if (e.key === '?') openHelp();
}
boot();

</script>
